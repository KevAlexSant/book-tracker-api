<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Catalog</title>
</head>

<body>

<h1>Book Catalog</h1>

<div th:if="${#lists.isEmpty(books)}">
    <p>No books found.</p>
</div>

<div th:each="book : ${books}">
    <h2 th:text="${book.title}">Book Title</h2>

    <p>
        <strong>Author:</strong>
        <span th:text="${book.author.firstName + ' ' + book.author.lastName}">
            Author Name
        </span>
    </p>

    <p>
        <strong>Genre:</strong>
        <span th:text="${book.genre}">Genre</span>
    </p>

    <p>
        <strong>Price:</strong>
        $<span th:text="${book.price}">0.00</span>
    </p>

    <p>
        <strong>Published:</strong>
        <span th:text="${book.publishedDate}">2026-01-01</span>
    </p>

    <hr>
</div>

</body>
</html>
