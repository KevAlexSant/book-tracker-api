<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Bookshelf</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .search-button {
            text-decoration: none;
            background-color: #333;
            color: white;
            padding: 10px 16px;
            border-radius: 5px;
        }

        .book-entry {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .book-title {
            margin-top: 0;
        }

        .label {
            font-weight: bold;
        }

        .rating-form {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="header">

    <h1>My Bookshelf</h1>

    <a th:href="@{/books/search}" class="search-button">
        Search for Books
    </a>

</div>


<!-- EMPTY SHELF -->
<p th:if="${#lists.isEmpty(bookEntries)}">
    Your bookshelf is currently empty.
</p>


<!-- BOOK ENTRIES -->
<div th:each="entry : ${bookEntries}" class="book-entry">


    <!-- TITLE -->
    <h2 class="book-title"
        th:text="${entry.book.title}">
        Book Title
    </h2>


    <div th:if="${entry.book.authors != null and !#lists.isEmpty(entry.book.authors)}">

        <span class="label">Authors:</span>

        <span th:each="author, status : ${entry.book.authors}">
        <span th:text="${author}">Author Name</span>
        <span th:if="${!status.last}">, </span>
    </span>

    </div>


    <!-- PUBLISHED DATE -->
    <p th:if="${entry.book.publishedDate != null}">

        <span class="label">Published:</span>

        <span th:text="${entry.book.publishedDate}">
            Published Date
        </span>

    </p>


    <!-- READING STATUS -->
    <p>

        <span class="label">Status:</span>

        <span th:if="${entry.readingStatus != null}"
              th:text="${entry.readingStatus}">
            Reading Status
        </span>

        <span th:if="${entry.readingStatus == null}">
            No status selected
        </span>

    </p>


    <!-- CURRENT RATING -->
    <p>

        <span class="label">Current Rating:</span>

        <span th:if="${entry.rating != null}"
              th:text="${entry.rating + ' / 5'}">
            Rating
        </span>

        <span th:if="${entry.rating == null}">
            Not rated yet
        </span>

    </p>


    <!-- UPDATE RATING -->
    <form
            class="rating-form"
            th:action="@{/shelf/entries/{entryId}/rating(entryId=${entry.id})}"
            method="post">

        <label>
            <strong>Set Rating:</strong>

            <select name="rating">

                <option value=""
                        th:selected="${entry.rating == null}">
                    No Rating
                </option>

                <option value="1"
                        th:selected="${entry.rating == 1}">
                    1 / 5
                </option>

                <option value="2"
                        th:selected="${entry.rating == 2}">
                    2 / 5
                </option>

                <option value="3"
                        th:selected="${entry.rating == 3}">
                    3 / 5
                </option>

                <option value="4"
                        th:selected="${entry.rating == 4}">
                    4 / 5
                </option>

                <option value="5"
                        th:selected="${entry.rating == 5}">
                    5 / 5
                </option>

            </select>

        </label>

        <button type="submit">
            Update Rating
        </button>

    </form>


    <!-- DESCRIPTION -->
    <p th:if="${entry.book.description != null}">

        <span class="label">Description:</span>

        <span th:text="${entry.book.description}">
            Description
        </span>

    </p>


    <!-- ISBN-13 -->
    <p th:if="${entry.book.isbn13 != null}">

        <span class="label">ISBN-13:</span>

        <span th:text="${entry.book.isbn13}">
            ISBN
        </span>

    </p>

</div>

</body>
</html>
