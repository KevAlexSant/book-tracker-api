<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Search Books</title>
</head>

<body>

<h1>Search Google Books</h1>

<!-- BACK TO SHELF -->
<a th:href="@{/shelf}">
    <button type="button">Back to Shelf</button>
</a>

<br><br>

<!-- SEARCH FORM -->
<form th:action="@{/books/search}" method="get">

    <input
            type="text"
            name="query"
            placeholder="Search by title, author, ISBN..."
            th:value="${param.query}"
            required>

    <button type="submit">
        Search
    </button>

</form>

<hr>


<!-- SEARCH RESULTS -->
<div th:if="${results != null}">

    <!-- NO RESULTS -->
    <div th:if="${#lists.isEmpty(results)}">
        <p>No books found.</p>
    </div>


    <!-- BOOK -->
    <div th:each="book : ${results}">

        <!-- BOOK COVER -->
        <div th:if="${book.volumeInfo.imageLinks != null
                    and book.volumeInfo.imageLinks.thumbnail != null}">

            <img
                    th:src="${book.volumeInfo.imageLinks.thumbnail}"
                    th:alt="${book.volumeInfo.title}"
                    width="128">

        </div>

        <div th:if="${book.volumeInfo.imageLinks == null
                    or book.volumeInfo.imageLinks.thumbnail == null}">

            <p>No cover available</p>

        </div>


        <!-- TITLE -->
        <h2 th:text="${book.volumeInfo.title}">
            Book Title
        </h2>


        <!-- AUTHORS -->
        <p>
            <strong>Authors:</strong>

            <span
                    th:if="${book.volumeInfo.authors != null
                           and !#lists.isEmpty(book.volumeInfo.authors)}"
                    th:text="${#strings.listJoin(book.volumeInfo.authors, ', ')}">
                Author
            </span>

            <span th:if="${book.volumeInfo.authors == null
                         or #lists.isEmpty(book.volumeInfo.authors)}">
                Unknown author
            </span>
        </p>


        <!-- DESCRIPTION -->
        <div th:if="${book.volumeInfo.description != null}">

            <strong>Description:</strong>

            <p th:text="${book.volumeInfo.description}">
                Description
            </p>

        </div>


        <!-- IDENTIFIERS -->
        <div th:if="${book.volumeInfo.industryIdentifiers != null
                    and !#lists.isEmpty(book.volumeInfo.industryIdentifiers)}">

            <strong>Identifiers:</strong>

            <ul>
                <li th:each="identifier : ${book.volumeInfo.industryIdentifiers}">

                    <span th:text="${identifier.type}">
                        Type
                    </span>

                    :

                    <span th:text="${identifier.identifier}">
                        Identifier
                    </span>

                </li>
            </ul>

        </div>


        <!-- GOOGLE BOOK ID -->
        <p>
            <strong>Google Volume ID:</strong>
            <span th:text="${book.id}"></span>
        </p>


        <!-- ADD TO SHELF -->
        <form
                th:action="@{/shelf/add}"
                method="post">

            <input
                    type="hidden"
                    name="googleBookId"
                    th:value="${book.id}">

            <button type="submit">
                Add to Shelf
            </button>

        </form>

        <hr>

    </div>

</div>

</body>

</html>
