spring:
  application:
    name: book-list

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mypassword}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    locations: classpath:db/migration


google:
  books:
    api-key: ${MY_API_KEY}
    base-url: https://www.googleapis.com/books/v1
    max-results: 40