spring:
  application:
    name: book-list

  datasource:
    url: jdbc:postgresql://localhost:5433/mydb
    username: postgres
    password: mypassword

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
      location: classpath:db/migration


google:
  books:
    api-key: ${MY_API_KEY}
    base-url: https://www.googleapis.com/books/v1
    max-results: 40